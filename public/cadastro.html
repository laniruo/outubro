<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="server" href="server.js">
</head>

<body class="cadastro">

    <nav class="menu">
        <a href="index.html" class="link-menu">Home</a>
        <a href="galeria.html" class="link-menu">galeria</a>
        <a href="chat.html" class="link-menu">Chat</a>
        <a href="cadastro.html" class="link-menu">cadastro</a>
        <a href="login.html" class="link-menu">login</a>
    </nav>

    <div class="box-cadastro">

        <h1>Cadastro</h1>

        <label for="usuario">Nome do usuário</label><br>
        <input type="text" id="usuario" placeholder="Digite seu nome"><br><br>

        <label for="email">E-mail</label><br>
        <input type="email" id="email" placeholder="Digite seu e-mail"><br><br>

        <label for="senha">Senha</label><br>
        <input type="password" id="senha" placeholder="Digite sua senha"><br><br>

        <button onclick="validarDados()">Enviar</button>

        <div id="resposta"></div>

    </div>

    <script>
        async function validarDados() {
    const usuarioEntrada = document.querySelector('#usuario');
    const emailEntrada = document.querySelector('#email');
    const senhaEntrada = document.querySelector('#senha');
    const resposta = document.querySelector('#resposta');

    const usuarioDigitado = usuarioEntrada.value;
    const emailDigitado = emailEntrada.value;
    const senhaDigitada = senhaEntrada.value;

    if (!usuarioDigitado || !emailDigitado || !senhaDigitada) {
        resposta.innerText = 'Preencha todos os campos antes de enviar!';
        resposta.style.color = 'red';
        return;
    }

    resposta.innerText = 'Aguarde, cadastrando no servidor...';
    resposta.style.color = 'orange';

    try {
        const respostaBe = await fetch('https://outubro.onrender.com/cadastro.html', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                usuario: usuarioDigitado,
                email: emailDigitado,
                senha: senhaDigitada
            })
        });

    
        const contentType = respostaBe.headers.get("content-type");
        let dados;

        if (contentType && contentType.includes("application/json")) {
            dados = await respostaBe.json();
        } else {
            
            const textoErro = await respostaBe.text();
            console.error("O servidor não respondeu JSON. Resposta:", textoErro);
            resposta.innerText = 'O servidor retornou um formato inválido!';
            resposta.style.color = 'red';
            return;
        }

        if (!respostaBe.ok) {
            resposta.innerText = dados.erro || 'Erro ao processar cadastro.';
            resposta.style.color = 'red';
            return;
        }

        resposta.innerText = dados.mensagem || 'Cadastro realizado com sucesso!';
        resposta.style.color = 'green';

        usuarioEntrada.value = '';
        emailEntrada.value = '';
        senhaEntrada.value = '';

    } catch (erro) {
        console.error('Erro na requisição:', erro);
        resposta.innerText = 'Erro ao conectar com o servidor!!';
        resposta.style.color = 'red';
    }
}
</script>
